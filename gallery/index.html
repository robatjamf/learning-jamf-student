<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCRI Workshop March 4-6 2026</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: "Permanent Marker", "Segoe Print", "Comic Sans MS", cursive, sans-serif;
      background: #151515;
      color: #e5e5e5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Background with fade */
    .bg-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(21, 21, 21, 0.8), rgba(21, 21, 21, 0.8)), 
                  url('img/fallsbg.jpg') no-repeat center center;
      background-size: cover;
      z-index: -1;
    }

    /* Lock screen */
    #lock {
      position: fixed;
      inset: 0;
      background: #151515;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #lock h2 {
      font-size: 1.3rem;
      font-weight: 600;
      color: #999;
      margin-bottom: 1.25rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #lock input {
      font-size: 1.1rem;
      padding: 0.7rem 1rem;
      border: 2px solid #333;
      border-radius: 10px;
      text-align: center;
      width: 200px;
      outline: none;
      background: #1e1e1e;
      color: #e5e5e5;
    }
    #lock input::placeholder { color: #555; }
    #lock input:focus { border-color: #555; }
    #lock input.error {
      border-color: #f43f5e;
      animation: shake 0.35s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    #lock button {
      margin-top: 1rem;
      padding: 0.65rem 2rem;
      font-size: 0.95rem;
      font-weight: 600;
      background: #333;
      color: #e5e5e5;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #lock button:hover { background: #444; transform: scale(1.04); }
    #lock button:active { transform: scale(0.97); }
    #lock .hint {
      margin-top: 0.6rem;
      font-size: 0.8rem;
      color: #f43f5e;
      min-height: 1.2em;
      font-weight: 600;
    }

    /* Gallery */
    #gallery {
      display: none;
      padding: 4rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 4rem;
    }
    .header h1 {
      font-size: 3rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
      letter-spacing: -0.02em;
    }

    /* Polaroid Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 3rem;
      padding: 2rem;
    }

    .polaroid {
      background: #fff;
      padding: 15px 15px 40px 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-decoration: none;
      color: #333;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .polaroid:nth-child(odd) { transform: rotate(-3deg); }
    .polaroid:nth-child(even) { transform: rotate(3deg); }
    .polaroid:nth-child(3n) { transform: rotate(5deg); }
    .polaroid:nth-child(3n+1) { transform: rotate(-5deg); }

    .polaroid:hover {
      transform: scale(1.1) rotate(0deg) !important;
      z-index: 10;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
    }

    .photo-placeholder {
      width: 100%;
      aspect-ratio: 1/1;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      overflow: hidden;
      border: 1px solid #ddd;
    }

    .photo-placeholder span {
      font-size: 4rem;
      opacity: 0.2;
    }

    .name {
      font-size: 1.4rem;
      text-align: center;
      color: #333;
      margin-top: 10px;
    }

    .footer {
      text-align: center;
      margin-top: 5rem;
      color: #999;
      font-size: 1rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap');
  </style>
</head>
<body>
  <div class="bg-overlay"></div>

  <div id="lock">
    <h2>Enter password</h2>
    <input type="password" id="pin" placeholder="Password" autofocus>
    <button onclick="checkPin()">Unlock</button>
    <div class="hint" id="hint"></div>
  </div>

  <div id="gallery">
    <div class="header">
      <h1>MCRI Showcase 2026</h1>
    </div>

    <div class="grid"></div>

    <div class="footer">Matter Career Readiness Institute</div>
  </div>

  <script>
    var students = [
      { name: 'Amanda', href: 'amanda/index.html' },
      { name: 'Crown', href: 'crown/index.html' },
      { name: 'Lucile', href: 'lucile/index.html' },
      { name: 'Naishe', href: 'naishe/index.html' },
      { name: 'Nate', href: 'nate/index.html' },
      { name: 'Octavia', href: 'octavia/index.html' },
      { name: 'Pride', href: 'pride/index.html' },
      { name: 'Prosperity', href: 'prosperity/index.html' },
      { name: 'Ron', href: 'ron/index.html' },
      { name: 'Sarah', href: 'sarah/index.html' },
      { name: 'Sean', href: 'sean/index.html' },
      { name: 'Shine', href: 'shine/index.html' },
      { name: 'Tana', href: 'tana/index.html' },
      { name: 'Wadzie', href: 'wadzie/index.html' }
    ];

    var grid = document.querySelector('.grid');
    students.forEach(function(s) {
      var card = document.createElement('a');
      card.className = 'polaroid';
      card.href = s.href;
      card.innerHTML =
        '<div class="photo-placeholder"><span>' + s.name[0] + '</span></div>' +
        '<div class="name">' + s.name + '</div>';
      grid.appendChild(card);
    });

    var pin = document.getElementById('pin');
    pin.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') checkPin();
    });

    function checkPin() {
      if (pin.value === 'MCRI') {
        document.getElementById('lock').style.display = 'none';
        document.getElementById('gallery').style.display = 'block';
      } else {
        pin.classList.add('error');
        document.getElementById('hint').textContent = 'Nope, try again';
        pin.value = '';
        setTimeout(function() { pin.classList.remove('error'); }, 400);
      }
    }
  </script>
</body>
</html>
